    <!-- Contenedor Principal -->
    <main class="app-main">
      <!-- Encabezado Superior -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobile-menu-toggle" aria-label="Abrir menú">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <!-- Selector de Finca Activa -->
          <div class="farm-selector-wrapper">
            <label for="global-farm-select">Finca:</label>
            <select id="global-farm-select" class="farm-select">
              <option value="todas">Todas las Fincas</option>
            </select>
          </div>
        </div>

        <div class="header-right">
          <!-- Widget Clima de Anserma -->
          <button class="weather-chip" id="header-weather-chip" title="Ver información del tiempo en Anserma, Caldas">
            <span class="weather-icon">⛅</span>
            <span class="weather-label"><strong>20°C</strong> Anserma</span>
          </button>

          <!-- Campana de Alertas -->
          <button class="icon-btn" id="header-alert-btn" aria-label="Alertas">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="icon-badge" id="header-alert-badge" style="display: none;">0</span>
          </button>

          <!-- Botón Rápido de Acción (+) -->
          <button class="btn btn-primary btn-sm" id="quick-action-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span class="desktop-only">Acción Rápida</span>
          </button>
        </div>
      </header>

      <!-- Área Dinámica de Contenido -->
      <section class="content-area" id="main-content-view">
        <!-- Se renderiza reactivamente mediante JavaScript -->
      </section>
    </main>

    <!-- Barra de Navegación Inferior para Móviles -->
    <nav class="mobile-nav-bar">
      <button class="mobile-nav-item active" data-view-target="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>

        <span>Finanzas</span>
      </button>

      <button class="mobile-nav-item" data-view-target="calendario">

    <!-- Modal Global Reutilizable para todos los formularios -->
    <div class="modal-overlay" id="global-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title">Título del Formulario</h3>
          <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Campos dinámicos -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" id="modal-cancel-btn">Cancelar</button>
          <button class="btn btn-primary" id="modal-save-btn">Guardar Información</button>
        </div>
      </div>
    </div>

    <!-- Contenedor para Notificaciones Toast -->
    <div class="toast-container" id="toast-container"></div>

  <!-- Registro de Service Worker para funcionamiento sin conexión (Solo en HTTP/HTTPS) -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('ServiceWorker no disponible:', err);
        });
      });
    }
  </script>

  <!-- Módulos de la Aplicación (Autónomo para file:// y http://) -->
  <script src="js/agrocaldas.js"></script>
